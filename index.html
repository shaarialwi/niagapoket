<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133d32"><title>NiagaPoket · POS Gerai</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#17392f;font:16px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #d8dfd7;border-radius:12px;background:white;padding:13px;color:inherit}button:hover{background:#e8efe6}button:disabled{opacity:.4;cursor:not-allowed}input,select{width:100%;padding:13px;border:1px solid #ced8cf;border-radius:10px;background:white;color:#19382f}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}header{background:#133d32;color:white;padding:25px max(22px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:800;letter-spacing:-1px}.logo span{color:#dfef8c}small,.muted{color:#687d71;font-size:13px}header small{color:#bdcfc4}.shell{max-width:1180px;margin:auto;padding:26px 22px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{font-size:12px;border-radius:30px;padding:8px 12px;background:#e7efcb;display:inline-block}.notice{background:#fff5d9;border:1px solid #ebdbab;padding:12px 16px;border-radius:12px;font-size:13px;margin:20px 0}h1{font-size:32px;letter-spacing:-1px;margin:4px 0}h2{font-size:20px;margin:0 0 18px}h3{font-size:16px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.card{padding:24px;border:1px solid #e0e5dc;background:white;border-radius:20px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{text-align:left;padding:20px;min-height:124px;background:#f7f8f2}.product b{display:block;margin:8px 0}.icon{font-size:26px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf0e8}.qty{display:flex;align-items:center;gap:10px}.qty button{padding:5px 12px}.total{font-size:36px;font-weight:800;letter-spacing:-1px}.primary{background:#173f32;color:white;border-color:#173f32}.primary:hover{background:#285741}.wide{width:100%;margin-top:12px}.subtle{background:#eef3e8}.tabs{display:flex;gap:6px;background:white;border:1px solid #dae1d7;padding:7px;border-radius:18px;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;box-shadow:0 8px 40px #17392f15}.tabs button{border:0;min-width:100px}.tabs .active{background:#163f32;color:white}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.metric{background:#fff;padding:23px;border:1px solid #dfe4d9;border-radius:16px}.metric strong{display:block;font-size:27px;margin-top:10px}.empty{text-align:center;padding:36px 12px;color:#7a897f}.badge{font-size:11px;border-radius:6px;padding:5px 8px;background:#edf0e7}.pending{background:#fff0c4}.paid{background:#deefde}.refunded{background:#f6e0dc}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px;padding:8px 12px}dialog{border:0;border-radius:22px;max-width:440px;width:calc(100% - 30px);padding:26px;color:#17392f}dialog::backdrop{background:#0d221bb3}.qr{display:block;max-width:240px;max-height:280px;object-fit:contain;margin:18px auto}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#163f32;color:white;padding:14px 24px;border-radius:12px;z-index:20;box-shadow:0 4px 30px #0003}.inline{display:flex;gap:10px;align-items:end}.inline>div{flex:1}#view{margin-top:22px}.bar{height:9px;background:#e9ede2;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#66865a}a{color:inherit} @media(max-width:720px){header{padding:20px}.grid{grid-template-columns:1fr}.shell{padding:20px 16px 110px}.card{padding:18px}.metrics{grid-template-columns:1fr 1fr}.metrics .metric:first-child{grid-column:span 2}.tabs{bottom:10px;width:calc(100% - 20px);justify-content:space-around}.tabs button{min-width:0;padding:12px 10px;font-size:13px}h1{font-size:27px}.top{align-items:start}.row{flex-wrap:wrap}.metric strong{font-size:25px}}
</style><header><div><div class="logo">Niaga<span>Poket.</span></div><small>Jual. Semak. Rekod.</small></div><div style="text-align:right"><span class="pill">POS GERAI</span><br><small id="clock"></small></div></header><main class="shell"><div class="top"><div><small id="stall"></small><h1 id="heading"></h1></div><span class="pill">● Pengesahan manual</span></div><div class="notice">Bayaran QR perlu disemak dalam TNG sebelum disahkan. Aplikasi ini tidak disambungkan kepada TNG.</div><div id="view"></div><p class="muted">Rekod disimpan pada pelayar/peranti ini sahaja. Muat turun sandaran secara berkala. Tiada penyegerakan antara telefon.</p></main><nav class="tabs" aria-label="Navigasi utama"><button data-tab="sell">▦ Jual</button><button data-tab="history">↔ Transaksi</button><button data-tab="report">▥ Laporan</button><button data-tab="settings">⚙ Tetapan</button></nav><dialog id="modal"></dialog><div id="toast" hidden class="toast" role="status"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+(n/100).toFixed(2),day=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kuala_Lumpur',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d)),today=()=>day(Date.now());
let db={name:'Gerai Saya',qr:'',products:[{id:'p1',name:'Nasi lemak',price:500,icon:'🍚'},{id:'p2',name:'Ayam goreng',price:650,icon:'🍗'},{id:'p3',name:'Air sirap',price:300,icon:'🥤'},{id:'p4',name:'Kuih campur',price:200,icon:'🥮'}],sales:[]};try{const s=localStorage.getItem('niagapoket-v1');if(s)db=JSON.parse(s)}catch(e){alert('Storan tidak dapat dibaca. Sila gunakan pelayar biasa dan simpan sandaran.')}let tab='sell',cart=[],date=today(),search='';
function persist(next){try{localStorage.setItem('niagapoket-v1',JSON.stringify(next));db=next;return true}catch(e){alert('Rekod tidak dapat disimpan. Storan mungkin penuh atau disekat. Sila eksport sandaran.');return false}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}function total(){return cart.reduce((a,p)=>a+p.price*p.qty,0)}function open(html){$('#modal').innerHTML=html;$('#modal').showModal()}function close(){$('#modal').close()}function navigate(t){tab=t;render()}function render(){$('#stall').textContent=db.name;$('#clock').textContent=new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kuala_Lumpur'});$('#heading').textContent={sell:'Jom mula berniaga.',history:'Setiap jualan, direkod.',report:'Prestasi gerai anda.',settings:'Gerai anda, cara anda.'}[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({sell:renderSell,history:renderHistory,report:renderReport,settings:renderSettings})[tab]()}
function renderSell(){$('#view').innerHTML=`<div class="grid"><section class="card"><h2>Menu gerai</h2><div class="products">${db.products.map(p=>`<button class="product" data-product="${p.id}"><span class="icon">${p.icon||'🍽️'}</span><b>${esc(p.name)}</b><small>${money(p.price)}</small></button>`).join('')}</div><form id="quick"><h3>Jualan pantas</h3><label for="quickname">Butiran (pilihan)</label><input id="quickname" placeholder="Contoh: Pesanan khas" maxlength="80"><div class="inline"><div><label for="amount">Amaun (RM)</label><input id="amount" type="number" min="0.01" max="99999" step="0.01" inputmode="decimal" required placeholder="0.00"></div><button class="primary">+ Tambah</button></div></form></section><section class="card"><div class="top"><h2>Pesanan semasa</h2><button id="clear" style="padding:6px 10px">Kosongkan</button></div>${cart.length?cart.map((p,i)=>`<div class="row"><div><b>${esc(p.name)}</b><br><small>${money(p.price)} setiap satu</small></div><div class="qty"><button data-dec="${i}" aria-label="Kurangkan ${esc(p.name)}">−</button>${p.qty}<button data-inc="${i}" aria-label="Tambah ${esc(p.name)}">+</button></div><b>${money(p.price*p.qty)}</b></div>`).join(''):'<div class="empty">🧺<h3>Pesanan pertama bermula di sini</h3>Pilih menu atau masukkan amaun.</div>'}<div class="row" style="border:0;margin-top:20px"><span>Jumlah</span><span class="total">${money(total())}</span></div><button class="primary wide" id="qrpay" ${!cart.length?'disabled':''}>Bayaran QR →</button><button class="subtle wide" id="cashpay" ${!cart.length?'disabled':''}>Bayaran tunai</button><p class="muted">QR: semak penerimaan wang dalam TNG sebelum mengesahkan jualan.</p></section></div>`;document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{const p=db.products.find(p=>p.id===b.dataset.product),c=cart.find(c=>c.id===p.id);if(c)c.qty++;else cart.push({...p,qty:1});renderSell()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{if(--cart[b.dataset.dec].qty===0)cart.splice(b.dataset.dec,1);renderSell()});document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{cart[b.dataset.inc].qty++;renderSell()});$('#clear').onclick=()=>{cart=[];renderSell()};$('#quick').onsubmit=e=>{e.preventDefault();const price=Math.round(Number($('#amount').value)*100);if(!Number.isSafeInteger(price)||price<=0)return;cart.push({id:crypto.randomUUID(),name:$('#quickname').value.trim()||'Jualan pantas',price,qty:1});renderSell()};$('#cashpay').onclick=cash;$('#qrpay').onclick=()=>{const s=createSale('qr','pending');if(s){showQR(s.id);renderSell()}}}
function createSale(method,status,extra={}){if(!cart.length)return;const s={id:crypto.randomUUID(),number:'NP-'+Date.now().toString(36).toUpperCase(),at:new Date().toISOString(),items:structuredClone(cart),amount:total(),method,status,...extra};if(persist({...db,sales:[s,...db.sales]})){cart=[];return s}}
function cash(){open(`<h2>Bayaran tunai</h2><div class="total">${money(total())}</div><form id="cashform"><label>Tunai diterima (RM)</label><input id="received" type="number" min="${total()/100}" step="0.01" value="${(total()/100).toFixed(2)}" required inputmode="decimal"><p id="change">Baki: RM 0.00</p><button class="primary wide">Sahkan tunai diterima</button></form><button class="wide" onclick="close()">Kembali</button>`);$('#received').oninput=()=>$('#change').textContent='Baki: '+money(Math.max(0,Math.round(Number($('#received').value)*100)-total()));$('#cashform').onsubmit=e=>{e.preventDefault();const received=Math.round(Number($('#received').value)*100);if(received<total())return;const change=received-total();if(createSale('cash','paid',{received,change,confirmedAt:new Date().toISOString()})){close();render();toast('Tunai direkod · Baki '+money(change))}}}
function showQR(id){const s=db.sales.find(s=>s.id===id);if(!s||s.status!=='pending')return;open(`<span class="pill">MENUNGGU SEMAKAN</span><h2 style="margin-top:18px">${esc(s.number)}</h2><div class="total">${money(s.amount)}</div>${db.qr?`<img class="qr" src="${db.qr}" alt="Kod QR penjual">`:'<div class="empty">Gunakan QR sedia ada penjual.<br>Imej QR boleh ditambah di Tetapan.</div>'}<p class="muted">Pastikan pembeli membayar amaun tepat. Semak transaksi masuk dalam TNG — jangan bergantung pada skrin pembeli.</p><form id="verify"><label>Rujukan transaksi (pilihan)</label><input id="reference" maxlength="100" placeholder="Rujukan daripada TNG"><label style="display:flex;gap:10px;align-items:start"><input type="checkbox" required style="width:22px">Saya telah menyemak penerimaan ${money(s.amount)} dalam TNG.</label><button class="primary wide">Sahkan secara manual</button></form><button class="wide" onclick="close()">Semak kemudian</button>`);$('#verify').onsubmit=e=>{e.preventDefault();if(update(id,{status:'paid',confirmedAt:new Date().toISOString(),reference:$('#reference').value.trim()})){close();render();toast('Bayaran disahkan secara manual')}}}
function update(id,patch){return persist({...db,sales:db.sales.map(s=>s.id===id?{...s,...patch}:s)})}const statusText=s=>({pending:'Menunggu semakan',paid:s.method==='qr'?'Disahkan manual':'Tunai diterima',cancelled:'Dibatalkan',refunded:'Bayaran balik direkod'})[s.status];
function selected(){return db.sales.filter(s=>day(s.at)===date)}function dateControl(){return `<label for="date">Tarikh jualan (Malaysia)</label><input id="date" type="date" value="${date}" style="max-width:230px">`}function bindDate(fn){$('#date').onchange=e=>{if(e.target.value){date=e.target.value;fn()}}}
function renderHistory(){$('#view').innerHTML=`<section class="card"><div class="top"><h2>Rekod transaksi</h2><span class="pill">${selected().length} transaksi</span></div>${dateControl()}<label for="search">Cari pesanan / rujukan / produk</label><input id="search" value="${esc(search)}" placeholder="Cari transaksi"><div id="list"></div></section>`;bindDate(renderHistory);$('#search').oninput=e=>{search=e.target.value;historyList()};historyList()}
function historyList(){const rows=selected().filter(s=>JSON.stringify([s.number,s.reference,s.items.map(i=>i.name)]).toLowerCase().includes(search.toLowerCase()));$('#list').innerHTML=rows.length?rows.map(s=>`<div class="row"><div><b>${esc(s.number)}</b> <span class="badge ${s.status}">${statusText(s)}</span><p class="muted">${new Date(s.at).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'})} · ${s.method==='qr'?'QR':'Tunai'} · ${s.items.map(i=>esc(i.name)+' × '+i.qty).join(', ')}</p>${s.reference?`<small>Rujukan: ${esc(s.reference)}</small>`:''}</div><div><b>${money(s.amount)}</b><div class="actions">${s.status==='pending'?`<button onclick="showQR('${s.id}')">Semak bayaran</button><button onclick="changeStatus('${s.id}','cancelled')">Batal</button>`:s.status==='paid'?`<button onclick="changeStatus('${s.id}','refunded')">Rekod bayaran balik</button>`:''}</div></div></div>`).join(''):'<div class="empty">Tiada transaksi dijumpai untuk tarikh ini.</div>'}
function changeStatus(id,status){const refund=status==='refunded';open(`<h2>${refund?'Rekod bayaran balik':'Batalkan pesanan'}?</h2><p>${refund?'Pulangkan wang kepada pembeli terlebih dahulu. Tindakan ini hanya merekod bayaran balik penuh; ia tidak memindahkan wang.':'Pesanan ini akan dikecualikan daripada jumlah jualan.'}</p><form id="statusform"><label>Sebab</label><input id="reason" required maxlength="150"><button class="primary wide">${refund?'Wang telah dipulangkan — rekod':'Sahkan pembatalan'}</button></form><button onclick="close()" class="wide">Kembali</button>`);$('#statusform').onsubmit=e=>{e.preventDefault();if(update(id,{status,reason:$('#reason').value.trim(),changedAt:new Date().toISOString()})){close();render()}}}
function stats(){const rows=selected(),paid=rows.filter(s=>s.status==='paid'),ref=rows.filter(s=>s.status==='refunded');return {rows,paid,ref,net:paid.reduce((a,s)=>a+s.amount,0),refund:ref.reduce((a,s)=>a+s.amount,0),cash:paid.filter(s=>s.method==='cash').reduce((a,s)=>a+s.amount,0),qr:paid.filter(s=>s.method==='qr').reduce((a,s)=>a+s.amount,0)}}
function renderReport(){const x=stats(),items={};x.paid.forEach(s=>s.items.forEach(p=>{items[p.name]=(items[p.name]||0)+p.qty}));$('#view').innerHTML=`${dateControl()}<div class="metrics"><div class="metric"><small>Jualan bersih</small><strong>${money(x.net)}</strong><small>${x.paid.length} pesanan dibayar</small></div><div class="metric"><small>QR · disahkan manual</small><strong>${money(x.qr)}</strong></div><div class="metric"><small>Tunai</small><strong>${money(x.cash)}</strong></div></div><div class="grid"><section class="card"><h2>Ringkasan harian</h2><div class="row"><span>Jualan kasar</span><b>${money(x.net+x.refund)}</b></div><div class="row"><span>Bayaran balik penuh</span><b>${money(x.refund)}</b></div><div class="row"><span>Menunggu semakan</span><b>${x.rows.filter(s=>s.status==='pending').length}</b></div><div class="row"><span>Pesanan dibatalkan</span><b>${x.rows.filter(s=>s.status==='cancelled').length}</b></div><p class="muted">Mengikut tarikh pesanan asal. Bayaran balik mengemas kini hari jualan asal. Pesanan belum disahkan dan dibatalkan tidak dikira sebagai jualan.</p><button class="primary wide" id="csv">↓ Muat turun CSV</button></section><section class="card"><h2>Produk terjual</h2>${Object.entries(items).sort((a,b)=>b[1]-a[1]).map(([name,n])=>`<div class="row"><span>${esc(name)}</span><b>${n} unit</b></div>`).join('')||'<div class="empty">Sahkan jualan pertama untuk melihat produk terjual.</div>'}<p class="muted">Tidak termasuk pesanan yang dibayar balik sepenuhnya.</p></section></div>`;bindDate(renderReport);$('#csv').onclick=exportCSV}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCSV(){const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const rows=[['Order','Created MYT','Method','Status','Amount RM','Reference','Items','Confirmed at','Refund/cancel time','Reason'],...selected().map(s=>[s.number,new Date(s.at).toLocaleString('en-GB',{timeZone:'Asia/Kuala_Lumpur'}),s.method,statusText(s),(s.amount/100).toFixed(2),s.reference,s.items.map(p=>p.name+' x '+p.qty).join('; '),s.confirmedAt,s.changedAt,s.reason])];download('NiagaPoket-'+date+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV dimuat turun')}
function renderSettings(){$('#view').innerHTML=`<div class="grid"><section class="card"><h2>Profil & QR gerai</h2><form id="profile"><label>Nama gerai</label><input id="name" value="${esc(db.name)}" required maxlength="70"><button class="primary wide">Simpan nama</button></form><label for="qrfile">Muat naik QR anda (PNG / JPG, maksimum 1 MB)</label><input id="qrfile" type="file" accept="image/png,image/jpeg">${db.qr?`<img class="qr" src="${db.qr}" alt="QR gerai"><button id="removeqr">Buang imej QR</button>`:''}<p class="muted">Imej QR ini hanya dipaparkan kepada pembeli. Tiada sambungan akaun atau pengesahan automatik. Pastikan nama penerima dan QR betul sebelum digunakan.</p><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><h2>Sandaran rekod</h2><p class="muted">Menyahpasang pelayar atau memadam data laman boleh memadam rekod. Sandaran JSON merangkumi produk, transaksi dan QR.</p><button id="backup" class="wide">↓ Muat turun sandaran JSON</button><label>Pulihkan sandaran (menggantikan data peranti ini)</label><input id="restore" type="file" accept="application/json"></section><section class="card"><h2>Urus produk</h2>${db.products.map(p=>`<div class="row"><span>${esc(p.name)}<br><small>${money(p.price)}</small></span><button data-remove="${p.id}">Buang</button></div>`).join('')}<form id="productform"><label>Nama produk</label><input id="pname" maxlength="70" required><label>Harga (RM)</label><input id="pprice" type="number" min="0.01" max="99999" step="0.01" required inputmode="decimal"><button class="primary wide">+ Tambah produk</button></form><p class="muted">Menu awal ialah contoh. Buang atau tambah produk mengikut gerai anda.</p></section></div>`;$('#profile').onsubmit=e=>{e.preventDefault();if(persist({...db,name:$('#name').value.trim()||'Gerai Saya'})){render();toast('Nama disimpan')}};$('#productform').onsubmit=e=>{e.preventDefault();const name=$('#pname').value.trim(),price=Math.round(Number($('#pprice').value)*100);if(name&&price>0&&persist({...db,products:[...db.products,{id:crypto.randomUUID(),name,price,icon:'🍽️'}]}))renderSettings()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(persist({...db,products:db.products.filter(p=>p.id!==b.dataset.remove)}))renderSettings()});$('#qrfile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>1000000)return alert('Pilih PNG/JPG di bawah 1 MB.');const reader=new FileReader();reader.onload=()=>{if(persist({...db,qr:reader.result}))renderSettings()};reader.readAsDataURL(f)};if($('#removeqr'))$('#removeqr').onclick=()=>{if(persist({...db,qr:''}))renderSettings()};$('#backup').onclick=()=>download('NiagaPoket-backup-'+today()+'.json',JSON.stringify({version:1,data:db},null,2),'application/json');$('#restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error();const data=JSON.parse(await f.text());if(data.version!==1||!valid(data.data))throw Error();if(confirm('Gantikan semua data peranti ini dengan sandaran? Muat turun sandaran semasa dahulu.')){if(persist(data.data)){cart=[];render();toast('Sandaran dipulihkan')}}}catch(e){alert('Fail sandaran tidak sah. Data semasa tidak diubah.')}}}
function valid(d){const str=s=>typeof s==='string',num=n=>Number.isSafeInteger(n)&&n>=0,id=s=>str(s)&&/^[a-zA-Z0-9-]+$/.test(s);return d&&str(d.name)&&str(d.qr)&&(!d.qr||/^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(d.qr))&&Array.isArray(d.products)&&d.products.every(p=>id(p.id)&&str(p.name)&&num(p.price)&&(!p.icon||['🍚','🍗','🥤','🥮','🍽️'].includes(p.icon)))&&Array.isArray(d.sales)&&d.sales.every(s=>id(s.id)&&str(s.number)&&!isNaN(Date.parse(s.at))&&num(s.amount)&&['cash','qr'].includes(s.method)&&['paid','pending','cancelled','refunded'].includes(s.status)&&Array.isArray(s.items)&&s.items.every(i=>str(i.name)&&num(i.price)&&Number.isSafeInteger(i.qty)&&i.qty>0)&&s.amount===s.items.reduce((a,i)=>a+i.price*i.qty,0))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));render();
</script></html>
